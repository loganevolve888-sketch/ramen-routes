name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        run: npx --yes html-validate "**/*.html"

      - name: Check for broken relative links
        run: npx --yes linkinator . --recurse --skip "https://*"