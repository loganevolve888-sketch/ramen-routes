# Supabase Free-plan projects are paused after ~7 days without database
# activity. One tiny query a day keeps the cloud passport alive. The anon key
# is the same public one shipped in docs/index.html — RLS means this query
# always returns an empty list, which is fine: it only needs to touch Postgres.
#
# Caveat: GitHub disables scheduled workflows in repos with no commit activity
# for 60 days and emails you first — re-enable it from the Actions tab if that
# ever happens.
name: Supabase keep-alive

on:
  schedule:
    - cron: '23 6 * * *' # daily, 06:23 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database so the free project is never paused
        env:
          SUPABASE_URL: https://cckvflhmjaxearsmvrfv.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNja3ZmbGhtamF4ZWFyc212cmZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMjI5NjYsImV4cCI6MjEwNDc5ODk2Nn0.hTpwixMyGHXJWbkOVYv51-pp-5Y12z8_BEGakk4wj1U
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null
          echo "supabase pinged ok"
