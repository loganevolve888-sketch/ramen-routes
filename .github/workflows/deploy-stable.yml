name: Deploy Stable to AWS

# This is the only workflow that touches the live environment.
# It fires only when `stable` moves — i.e. when you merge main -> stable.



on:
  push:
    branches: [stable]

permissions:
  id-token: write   # needed for OIDC auth to AWS (no long-lived keys)
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # ties into GitHub Environments for approval gates/secrets
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          #cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build   # adjust if your build output dir isn't ./dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync build output to S3
        run: aws s3 sync ./dist s3://${{ secrets.AWS_S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
